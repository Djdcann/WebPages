<!-- Offline, self-contained viewer: every board is drawn with HTML + CSS from the data embedded

<style>
  :root{
    --bg:#0e1116; --panel:#181c24; --panel-2:#222834; --line:#2d3441;
    --text:#e8e8e8; --muted:#9aa2ad; --accent:#ff9500; --accent-ink:#1b1200; --blue-ui:#8fd8ff;
    /* board colours, matching the solution images */
    --frame:#22c93e; --gridline:#0a3d16; --empty:#ffffff; --wall:#22c93e;
    --orange:#ff9500; --unused:#ffd9a6; --unused-ink:#b87a2e;
    --blue:#4a90e2; --blue-edge:#1c5aa8; --teal:#2ec4c4; --teal-edge:#138585;
    --purple:#e91ee9; --purple-edge:#a6009e; --red:#e53935; --red-edge:#8e1c1a; --sweep:#f7c4c4;
    --cell:38px; --gap:2px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;background:var(--bg);color:var(--text);font-family:"Segoe UI",Roboto,Arial,sans-serif;
    -webkit-tap-highlight-color:transparent;}
  header{position:sticky;top:0;z-index:5;background:var(--panel);border-bottom:1px solid var(--line);padding:12px 16px 10px;}
  .top{display:flex;align-items:center;gap:14px;flex-wrap:wrap;}
  h1{font-size:1.15rem;margin:0;letter-spacing:.5px;}
  .row{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-top:8px;}
  .group{display:flex;gap:6px;flex-wrap:wrap;}
  .label{color:var(--muted);font-size:.8rem;min-width:56px;text-transform:uppercase;letter-spacing:.08em;}
  button{font:inherit;font-size:.9rem;color:var(--text);background:var(--panel-2);border:1px solid var(--line);
    border-radius:6px;padding:5px 11px;cursor:pointer;min-height:32px;touch-action:manipulation;}
  button:hover{border-color:var(--muted);}
  button:disabled{opacity:.4;cursor:default;}
  button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:600;}
  button:focus-visible{outline:2px solid var(--blue-ui);outline-offset:2px;}
  .tabs button{font-size:1rem;padding:6px 16px;}
  .toggles label{display:inline-flex;align-items:center;gap:7px;font-size:.9rem;cursor:pointer;
    background:var(--panel-2);border:1px solid var(--line);border-radius:6px;padding:5px 11px;min-height:32px;
    touch-action:manipulation;}
  .toggles label:hover{border-color:var(--muted);}
  .toggles input{width:16px;height:16px;margin:0;accent-color:var(--accent);cursor:pointer;}
  .toggles label.disabled{opacity:.45;cursor:default;}
  .toggles label.disabled input{cursor:default;}
  .nav{margin-left:auto;display:flex;gap:6px;flex-wrap:wrap;}
  main{padding:14px 16px 28px;display:flex;flex-direction:column;align-items:center;gap:10px;}
  .titlebar{display:flex;justify-content:space-between;align-items:baseline;gap:16px;flex-wrap:wrap;}
  .titlebar h2{margin:0;font-size:1.25rem;}
  .titlebar .sub{color:var(--muted);font-size:.9rem;}
  .card{display:flex;flex-direction:column;gap:10px;max-width:100%;scroll-margin-top:8px;}
  .source{color:var(--muted);font-size:.85rem;}
  .notes{margin:0;padding:0 0 0 18px;color:#d8dde4;font-size:.9rem;line-height:1.45;}
  .notes li{margin:2px 0;}
  .orient{color:var(--blue-ui);font-size:.85rem;}
  .orient:empty{display:none;}
  .hint{color:var(--muted);font-size:.8rem;text-align:center;}
  kbd{background:var(--panel-2);border:1px solid var(--line);border-radius:4px;padding:0 5px;font-size:.78rem;}
  .scroller{max-width:100%;overflow:auto;touch-action:manipulation;}
  .fithint{display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--panel);
    border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-size:.85rem;color:#d8dde4;}
  .fithint[hidden]{display:none;}
  .fithint button{flex:none;min-height:40px;}
  .mob-only{display:none !important;}
  .mbar{display:none;}

  /* ---------- board ---------- */
  .frame{position:relative;background:var(--frame);border-radius:10px;padding:26px;display:inline-block;
    animation:pop .14s ease-out;}
  @keyframes pop{from{opacity:.35;transform:scale(.985);}to{opacity:1;transform:none;}}
  @media (prefers-reduced-motion:reduce){.frame{animation:none;}}
  .grid{position:relative;display:grid;gap:var(--gap);padding:4px;background:var(--gridline);border-radius:4px;}
  .cell{width:var(--cell);height:var(--cell);border-radius:3px;background:var(--empty);position:relative;
    display:flex;align-items:center;justify-content:center;}
  .wall{background:var(--wall);}
  .sweep{background:var(--sweep);}
  .blue,.blueA{background:var(--blue);box-shadow:inset 0 0 0 2px var(--blue-edge);}
  .blueB,.spawn{background:var(--teal);box-shadow:inset 0 0 0 2px var(--teal-edge);}
  /* white label on a tile that gets shot: the step of the orange that shoots it */
  .hit{position:relative;z-index:1;color:#fff;font-family:Georgia,"Times New Roman",serif;font-weight:700;
    font-size:max(10px, calc(var(--cell) * .46));line-height:1;
    text-shadow:0 0 2px rgba(0,0,0,.75),0 1px 2px rgba(0,0,0,.6);}
  .hit.small{font-size:max(9px, calc(var(--cell) * .36));}
  .xmark.labelled::before,.xmark.labelled::after{opacity:.22;}
  .purple{background:var(--purple);box-shadow:inset 0 0 0 2px var(--purple-edge);}
  .red{background:var(--red);box-shadow:inset 0 0 0 2px var(--red-edge);}
  .slot{color:#fff;font-weight:700;font-size:max(8px, calc(var(--cell) * .3));}
  .orange{background:var(--orange);}
  .num{position:absolute;inset:16%;background:#fff;display:flex;align-items:center;justify-content:center;
    color:#000;font-family:Georgia,"Times New Roman",serif;font-weight:700;
    font-size:max(11px, calc(var(--cell) * .56));line-height:1;}
  .num.small{font-size:max(9px, calc(var(--cell) * .44));}
  .num .letter{font-family:"Segoe UI",Arial,sans-serif;font-size:max(7px, calc(var(--cell) * .28));margin-left:1px;
    align-self:flex-end;margin-bottom:6%;}
  .letterA{color:var(--blue-edge);} .letterB{color:var(--teal-edge);}
  .dot{position:absolute;top:5%;right:5%;width:26%;height:26%;border-radius:50%;background:var(--red);
    box-shadow:0 0 0 1px #fff;}
  .unused{background:var(--unused);color:var(--unused-ink);font-size:max(9px, calc(var(--cell) * .42));}
  .xmark::before,.xmark::after{content:"";position:absolute;left:22%;right:22%;top:calc(50% - 2px);height:4px;
    background:#fff;border-radius:2px;transform:rotate(45deg);}
  .xmark::after{transform:rotate(-45deg);}
  .seam{position:absolute;background:var(--blue-ui);pointer-events:none;}
  .edge{position:absolute;white-space:nowrap;font-weight:700;letter-spacing:.14em;pointer-events:none;
    transform:translate(-50%,-50%) rotate(var(--rot,0deg));font-size:12px;line-height:1;}
  .edge.board{color:var(--gridline);}
  .edge.entrance{background:var(--bg);color:#fff;padding:4px 10px;border-radius:4px;letter-spacing:.22em;}

  /* ---------- phones: portrait, or landscape with a short screen ---------- */
  @media (max-width:760px), (max-height:520px) and (pointer:coarse){
    header{position:static;padding:10px 10px 8px;}
    h1{font-size:1rem;}
    .top{gap:10px;flex-wrap:nowrap;}
    .top h1{flex:none;}
    .nav{display:none;}
    .desk-only{display:none !important;}
    .mob-only{display:inline-flex !important;}
    html,body{overflow-x:hidden;overscroll-behavior-x:none;}   /* no swipe-to-go-back on the page */
    .row{flex-wrap:nowrap;margin-top:6px;min-width:0;}
    .row > .label{flex:none;}
    .label{min-width:44px;font-size:.68rem;}
    /* level / wave / version: one swipeable line each, big touch targets */
    .strip{flex:1;min-width:0;flex-wrap:nowrap;overflow-x:auto;scroll-snap-type:x proximity;scrollbar-width:none;

    .strip button{flex:none;min-width:44px;min-height:44px;font-size:1rem;scroll-snap-align:center;}
    .tabs button{min-height:44px;padding:6px 14px;}
    .toggles{flex:1;min-width:0;flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;}
    .toggles::-webkit-scrollbar{display:none;}
    .toggles label,.toggles button{flex:none;min-height:44px;font-size:.85rem;padding:5px 10px;}
    .toggles input{width:20px;height:20px;}
    main{padding:8px 6px calc(84px + env(safe-area-inset-bottom));gap:8px;}
    .card{width:100%;align-items:center;gap:8px;}
    .titlebar{width:100%;gap:2px 10px;padding:0 4px;}
    .titlebar h2{font-size:1.05rem;}
    .titlebar .sub{font-size:.8rem;}
    .notes,.orient,.source,.fithint{align-self:stretch;margin-left:4px;margin-right:4px;}
    .notes{font-size:.85rem;}
    .hint{display:none;}
    .frame{padding:18px;border-radius:8px;}
    .edge{font-size:9.5px;letter-spacing:.1em;}
    .edge.entrance{padding:2px 6px;letter-spacing:.16em;}
    /* thumb bar */
    .mbar{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:10;gap:6px;align-items:stretch;
      padding:8px 8px calc(8px + env(safe-area-inset-bottom));background:rgba(24,28,36,.97);
      border-top:1px solid var(--line);}
    .mbar button{min-height:52px;min-width:52px;font-size:1.35rem;padding:0 6px;border-radius:10px;}
    .mbar .where{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
      gap:1px;font-size:.95rem;line-height:1.15;}
    .mbar .where b{font-size:1rem;white-space:nowrap;}
    .mbar .where small{color:var(--muted);font-size:.72rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%;}
  }

  @media (max-height:520px) and (pointer:coarse){
    .mbar{padding:4px 8px calc(4px + env(safe-area-inset-bottom));}
    .mbar button{min-height:44px;}
    main{padding-bottom:calc(60px + env(safe-area-inset-bottom));}
  }
  @media (hover:none){ .hint{display:none;} }
</style>

,{"r":2,"c":21,"t":"orange","n":3},{"r":3,"c":11,"t":"blue","h":"1"},{"r":3,"c":21,"t":"orange","n":1},{"r":4,"c":12,"t":"blue","h":"4"},{"r":5,"c":13,"t":"blue","h":"2"},{"r":5,"c":15,"t":"blue","h":"1"},{"r":5,"c":21,"t":"orange","n":1},{"r":6,"c":14,"t":"blue","h":"4"},{"r":6,"c":17,"t":"blue","h":"5"},{"r":7,"c":17,"t":"blue","h":"6"},{"r":7,"c":21,"t":"orange","n":7},{"r":9,"c":12,"t":"orange","n":4},{"r":9,"c":13,"t":"orange","n":2},{"r":9,"c":15,"t":"orange","n":2}],"edges":[{"side":"top","t":0.25,"text":"BOARD A"},{"side":"top","t":0.75,"text":"BOARD B"}],"seams":[[11,0,11,10]],"notes":["Timed solution. Seconds are counted from when the wave starts. Steps sharing a window are fired in number order, each after the previous shot lands. Same number = any order.","When to fire each step: 6-8 s: 1 · 12-14 s: 2 · 18-20 s: 3 · 24-26 s: 4 · 26-28 s: 5 · 28-30 s: 6 · 30-32 s: 7 · 36-38 s: 8 · 38-40 s: 9 · 44-46 s: 10. Wait through any gap.","Red phases repeat every 8 s: 0-2 s vertical bars, 2-4 s horizontal bars on odd rows, 4-6 s vertical bars on the other columns, 6-8 s horizontal bars on even rows. Each shot is clear of red in its window.","White number on a tile = the step of the orange that shoots it.","The boards are joined: ► shots from board A continue into board B, and ◄ shots from board B continue into board A."]}};

// ---- levels, waves and versions -------------------------------------------------------------
const TIMED = [['fast', 'Fastest (timed)'], ['solution', 'Fewest steps']];
const ONLY = label => [['solution', label]];
const GAMES = [
  { id: 'strategy', name: 'Strategy', levels: [
    { n: 1, waves: 4, variants: ONLY('Time-optimal'), source: 'activate-scores.ca' },
    { n: 2, waves: 4, variants: ONLY('Time-optimal'), source: 'activate-scores.ca' },
    { n: 3, waves: 5, variants: ONLY('Time-optimal'), source: 'activate-scores.ca' },
    { n: 4, waves: 5, variants: ONLY('Time-optimal'), source: 'activate-scores.ca' },
    { n: 5, waves: 5, variants: ONLY('Time-optimal'), source: 'activate-scores.ca' },
    { n: 6, waves: 5, variants: ONLY('Time-optimal'), source: 'activate-scores.ca, with the centre wall' },
    { n: 7, waves: 5, variants: ONLY('Fewest steps'), source: 'the ryflix simulator' },
    { n: 8, waves: 5, variants: ONLY('Fewest steps'), source: 'the ryflix simulator' },
    { n: 9, waves: 5, variants: TIMED, source: 'the ryflix simulator' },
    { n: 10, waves: 5, variants: TIMED, source: 'the ryflix simulator',
      extra: { 1: [['alt', 'Alternate (bottom 1st & 3rd = 1)']] } },
  ]},
  { id: 'gridlock', name: 'Gridlock', levels: [
    { n: 3, waves: 4, variants: ONLY('Time-optimal'), source: 'the ryflix simulator' },
    { n: 4, waves: 4, variants: ONLY('Time-optimal'), source: 'the ryflix simulator' },
    { n: 6, waves: 4, variants: ONLY('Time-optimal'), source: 'the ryflix simulator' },
    { n: 7, waves: 4, variants: ONLY('Fewest steps'), source: 'the ryflix simulator' },
    { n: 8, waves: 4, variants: ONLY('Fewest steps'), source: 'the ryflix simulator' },
    { n: 9, waves: 4, variants: TIMED, source: 'the ryflix simulator' },
    { n: 10, waves: 4, variants: TIMED, source: 'the ryflix simulator' },
  ]},
];
const ALL = [];
GAMES.forEach(g => g.levels.forEach(l => { for (let w = 1; w <= l.waves; w++) ALL.push({ g, l, w }); }));
const variantsFor = (l, w) => [...l.variants, ...((l.extra && l.extra[w]) || [])];
const keyFor = (g, l, w, v) => `${g.id}-${l.n}-${w}-${v}`;

// ---- rotation ---------------------------------------------------------------------------------
// k = number of clockwise quarter turns (0-3). Cells move; numbers stay upright; arrows turn.
const SIDES = ['top', 'right', 'bottom', 'left'];
const DIRS = ['up', 'right', 'down', 'left'];
const ARROW = { up: '▲', right: '►', down: '▼', left: '◄' };
function rotCell(r, c, R, C, k) {
  return [[r, c], [c, R - 1 - r], [R - 1 - r, C - 1 - c], [C - 1 - c, r]][k];
}
function rotPoint(x, y, W, H, k) {          // continuous grid coordinates, in cells
  return [[x, y], [H - y, x], [W - x, H - y], [y, W - x]][k];
}
const rotDir = (d, k) => DIRS[(DIRS.indexOf(d) + k) % 4];

// ---- state ------------------------------------------------------------------------------------
let state = { game: 'strategy', level: 1, wave: 1, variant: null };
let fit = true, rot = 0, showHits = false, showSpawn = false;    // both toggles start unchecked
try {
  fit = localStorage.getItem('fit') !== '0';
  rot = (+localStorage.getItem('rot') || 0) % 4;
  showHits = localStorage.getItem('showHits') === '1';
  showSpawn = localStorage.getItem('showSpawn') === '1';
} catch (e) {}
const save = () => {
  try {
    localStorage.setItem('fit', fit ? '1' : '0'); localStorage.setItem('rot', String(rot));
    localStorage.setItem('showHits', showHits ? '1' : '0'); localStorage.setItem('showSpawn', showSpawn ? '1' : '0');
  } catch (e) {}
};
// legend lines that belong to a toggle (matched by how they start)
const HIT_NOTE = 'White number on a tile', SPAWN_NOTE = 'Teal = where a purple';

// phone layout: same breakpoints as the CSS
const PHONE = window.matchMedia('(max-width:760px), (max-height:520px) and (pointer:coarse)');
const isPhone = () => PHONE.matches;

function current() {
  const g = GAMES.find(x => x.id === state.game) || GAMES[0];
  const l = g.levels.find(x => x.n === state.level) || g.levels[0];
  const w = Math.min(Math.max(1, state.wave), l.waves);
  const vs = variantsFor(l, w);
  const v = vs.some(x => x[0] === state.variant) ? state.variant : vs[0][0];
  return { g, l, w, v, vs };
}

function pills(el, items, isOn, onPick) {
  el.textContent = '';
  let active = null;
  items.forEach(([key, label]) => {
    const b = document.createElement('button');
    b.textContent = label;
    const on = isOn(key);
    b.setAttribute('aria-pressed', String(on));
    if (on) active = b;
    b.onclick = () => onPick(key);
    el.appendChild(b);
  });
  // keep the selected pill visible inside a swipeable strip (without scrolling the page)
  if (active && el.scrollWidth > el.clientWidth) {
    el.scrollLeft = Math.max(0, active.offsetLeft - el.offsetLeft - el.clientWidth / 2 + active.offsetWidth / 2);
  }
}

// ---- board drawing ----------------------------------------------------------------------------
const PAD = 4, GAP = 2;
const frameWidth = () => (isPhone() ? 18 : 26);

// Returns the square size in px for a board of RR rows x CC columns (as displayed).
function cellSize(RR, CC) {
  if (!fit) return 38;
  const F = frameWidth();
  if (isPhone()) {
    // fill the width; fit the height too, but never shrink below a readable 22 px just to
    // avoid a short vertical scroll
    const bar = document.getElementById('mbar').offsetHeight || 70;
    const title = document.querySelector('.titlebar').offsetHeight || 30;
    const availW = Math.min(window.innerWidth, document.documentElement.clientWidth) - 12;
    const availH = window.innerHeight - bar - title - 28;
    const byW = (availW - 2 * F - 2 * PAD + GAP) / CC - GAP;
    const byH = (availH - 2 * F - 2 * PAD + GAP) / RR - GAP;
    return Math.max(14, Math.min(48, Math.floor(Math.min(byW, Math.max(byH, 22)))));
  }
  const header = document.querySelector('header').offsetHeight;
  const availW = Math.min(document.querySelector('main').clientWidth - 32, 1600);
  const availH = window.innerHeight - header - 190;
  const byW = (availW - 2 * F - 2 * PAD + GAP) / CC - GAP;
  const byH = (availH - 2 * F - 2 * PAD + GAP) / RR - GAP;
  return Math.max(16, Math.min(44, Math.floor(Math.min(byW, byH))));
}

function drawBoard(view, k) {
  const R = view.rows, C = view.cols;
  const RR = k % 2 ? C : R, CC = k % 2 ? R : C;
  const cell = cellSize(RR, CC);
  const F = frameWidth();
  const frame = document.createElement('div');
  frame.className = 'frame';
  frame.style.padding = F + 'px';
  frame.style.setProperty('--cell', cell + 'px');
  const grid = document.createElement('div');
  grid.className = 'grid';
  grid.style.gridTemplateColumns = `repeat(${CC}, ${cell}px)`;
  grid.style.gridTemplateRows = `repeat(${RR}, ${cell}px)`;
  const at = new Map(view.cells.map(x => [x.r + ',' + x.c, x]));

  for (let r = 0; r < R; r++) for (let c = 0; c < C; c++) {
    let d = at.get(r + ',' + c) || { t: 'empty' };
    if (d.t === 'spawn' && !showSpawn) d = { t: 'empty' };        // hidden: that blue isn't there yet
    if (d.h && !showHits) d = { ...d, h: undefined };
    const [nr, nc] = rotCell(r, c, R, C, k);
    const el = document.createElement('div');
    el.className = 'cell ' + d.t;
    el.style.gridRow = nr + 1;
    el.style.gridColumn = nc + 1;
    if (d.t === 'orange') {
      const num = document.createElement('div');
      num.className = 'num' + (d.n >= 10 || d.l ? ' small' : '');
      num.textContent = d.n;
      if (d.l) {
        const s = document.createElement('span');
        s.className = 'letter letter' + d.l; s.textContent = d.l;
        num.appendChild(s);
      }
      el.appendChild(num);
      if (d.d) { const dot = document.createElement('span'); dot.className = 'dot'; el.appendChild(dot); }
      el.title = `Step ${d.n}` + (d.l ? ` (layout ${d.l})` : '') + (d.d ? ' · wait for the sweep' : '');
    } else if (d.t === 'unused') {
      el.textContent = ARROW[rotDir(d.a, k)];
      el.title = 'Not needed';
    } else if ((d.t === 'blueA' || d.t === 'blueB') && !d.h) {
      const s = document.createElement('span'); s.className = 'slot'; s.textContent = d.t.slice(-1);
      el.appendChild(s);
    } else if (d.t === 'red' && d.x) {
      el.classList.add('xmark'); el.title = 'Shot on purpose (costs a life)';
    }
    if (d.t === 'spawn') el.title = 'A purple\'s blue appears here once that purple is shot';
    if (d.h) {                                   // shot by the orange with this label
      const h = document.createElement('span');
      h.className = 'hit' + (String(d.h).length > 1 ? ' small' : '');
      h.textContent = d.h;
      el.appendChild(h);
      if (d.x) el.classList.add('labelled');
      el.title = (el.title ? el.title + ' · ' : '') + `Shot by step ${d.h}`;
    }
    grid.appendChild(el);
  }

  // positions along a grid side, in px (inside the grid box, which includes PAD)
  const along = (n, t) => PAD + t * (n * (cell + GAP) - GAP);
  const edge = u => PAD + u * (cell + GAP) - GAP / 2;             // boundary between cells
  const gw = CC * (cell + GAP) - GAP + 2 * PAD, gh = RR * (cell + GAP) - GAP + 2 * PAD;

  (view.seams || []).forEach(([x1, y1, x2, y2]) => {
    const [ax, ay] = rotPoint(x1, y1, C, R, k), [bx, by] = rotPoint(x2, y2, C, R, k);
    const s = document.createElement('div'); s.className = 'seam';
    if (ax === bx) { s.style.left = (edge(ax) - 1) + 'px'; s.style.top = PAD + 'px'; s.style.width = '2px'; s.style.height = (gh - 2 * PAD) + 'px'; }
    else { s.style.top = (edge(ay) - 1) + 'px'; s.style.left = PAD + 'px'; s.style.height = '2px'; s.style.width = (gw - 2 * PAD) + 'px'; }
    grid.appendChild(s);
  });
  frame.appendChild(grid);

  // labels sitting on the green frame: board names on the top edge, and ENTRANCE on the side the
  // data gives (the bottom unless a wave says otherwise). t runs clockwise round the board, so a
  // quarter turn just moves each label to the next side.
  const labels = [...(view.edges || []).map(e => ({ ...e, cls: 'board' })),
                  { side: view.entrance || 'bottom', t: 0.5, text: 'ENTRANCE', cls: 'entrance' }];
  labels.forEach(lab => {
    const side = SIDES[(SIDES.indexOf(lab.side) + k) % 4];
    const el = document.createElement('div');
    el.className = 'edge ' + lab.cls;
    el.textContent = lab.text;
    let x, y, turn = 0;
    if (side === 'top')    { x = F + along(CC, lab.t);     y = F / 2; }
    if (side === 'bottom') { x = F + along(CC, 1 - lab.t); y = F + gh + F / 2; }
    if (side === 'right')  { x = F + gw + F / 2; y = F + along(RR, lab.t);     turn = 90; }
    if (side === 'left')   { x = F / 2;           y = F + along(RR, 1 - lab.t); turn = -90; }
    el.style.left = x + 'px'; el.style.top = y + 'px';
    el.style.setProperty('--rot', turn + 'deg');
    frame.appendChild(el);
  });
  return { frame, cell, RR, CC };
}

// ---- page -------------------------------------------------------------------------------------
const entranceSide = view => SIDES[(SIDES.indexOf((view && view.entrance) || 'bottom') + rot) % 4];

// opts.scroll: on a phone, bring the board to the top of the screen (after picking a wave etc.)
function render(pushHash = true, opts = {}) {
  const { g, l, w, v, vs } = current();
  state = { game: g.id, level: l.n, wave: w, variant: v };
  const go = patch => { Object.assign(state, patch); render(true, { scroll: true }); };

  pills(document.getElementById('games'), GAMES.map(x => [x.id, x.name]), k => k === g.id,
        k => { state = { game: k, level: GAMES.find(x => x.id === k).levels[0].n, wave: 1, variant: null }; render(); });
  pills(document.getElementById('levels'), g.levels.map(x => [x.n, String(x.n)]), k => k === l.n,
        k => go({ level: k, wave: 1 }));
  pills(document.getElementById('waves'), Array.from({ length: l.waves }, (_, i) => [i + 1, String(i + 1)]),
        k => k === w, k => go({ wave: k }));
  pills(document.getElementById('variants'), vs, k => k === v, k => go({ variant: k }));
  document.getElementById('variantRow').style.display = vs.length > 1 ? '' : 'none';

  const view = DATA[keyFor(g, l, w, v)];
  const label = vs.find(x => x[0] === v)[1];
  const board = document.getElementById('board');
  board.textContent = '';
  const hint = document.getElementById('fitHint');
  hint.hidden = true;
  if (!view) {
    document.getElementById('title').textContent = `${g.name} ${l.n}-${w}`;
    document.getElementById('sub').textContent = '';
    board.textContent = 'No solution data for this wave.';
    document.getElementById('notes').textContent = '';
  } else {
    document.getElementById('title').textContent = view.title;
    document.getElementById('sub').textContent = `${label} · ${view.sub}`;
    const drawn = drawBoard(view, rot);
    board.appendChild(drawn.frame);
    // a board that fits: sideways swipes are ours (next / previous wave); a wider one scrolls
    const sc = document.getElementById('scroller');
    sc.style.touchAction = sc.scrollWidth > sc.clientWidth + 1 ? 'manipulation' : 'pan-y pinch-zoom';
    // on a phone, suggest a quarter turn when it would make the squares much bigger
    if (isPhone() && fit) {
      const turned = cellSize(drawn.CC, drawn.RR);
      if (drawn.cell < 24 && turned >= drawn.cell + 6) {
        document.getElementById('fitHintText').textContent =
          `Squares are small this way round (${drawn.cell} px). A quarter turn makes them ${turned} px.`;
        hint.hidden = false;
      }
    }
    const notes = document.getElementById('notes');
    notes.textContent = '';
    view.notes
      .filter(n => (showHits || !n.startsWith(HIT_NOTE)) && (showSpawn || !n.startsWith(SPAWN_NOTE)))
      .forEach(n => { const li = document.createElement('li'); li.textContent = n; notes.appendChild(li); });
  }
  const hasSpawn = !!(view && view.cells.some(c => c.t === 'spawn'));
  document.getElementById('optHits').checked = showHits;
  const spawnBox = document.getElementById('optSpawn');
  spawnBox.checked = showSpawn;
  spawnBox.disabled = !hasSpawn;
  const spawnLabel = document.getElementById('optSpawnLabel');
  spawnLabel.classList.toggle('disabled', !hasSpawn);
  spawnLabel.title = hasSpawn ? "Teal cells where a purple's blue will appear (P)" : 'No purples in this wave';
  document.getElementById('orient').textContent = rot && view
    ? `Rotated ${['', '90° right', '180°', '90° left'][rot]}. The notes describe the board with ENTRANCE at the ${view.entrance || 'bottom'}.`
    : '';
  document.getElementById('source').textContent = `Level layout from ${l.source}.`;

  // thumb bar
  document.getElementById('mTitle').textContent = `${g.name} ${l.n}-${w}`;
  const ARROW_TO = { top: '↑', right: '→', bottom: '↓', left: '←' };
  document.getElementById('mSub').textContent = `${label.replace(/ \(.*\)$/, '')} · entrance ${ARROW_TO[entranceSide(view)]}`;

  const i = ALL.findIndex(x => x.g === g && x.l === l && x.w === w);
  ['prev', 'mPrev'].forEach(id => { document.getElementById(id).disabled = i <= 0; });
  ['next', 'mNext'].forEach(id => { document.getElementById(id).disabled = i >= ALL.length - 1; });
  ['fit', 'fitM'].forEach(id => document.getElementById(id).setAttribute('aria-pressed', String(fit)));
  document.title = `${g.name} ${l.n}-${w} · Activate Solutions`;
  if (pushHash) history.replaceState(null, '', `#${keyFor(g, l, w, v)}-r${rot}`);
  if (opts.scroll && isPhone()) document.getElementById('card').scrollIntoView({ block: 'start' });
}

function step(d) {
  const { g, l, w } = current();
  const i = ALL.findIndex(x => x.g === g && x.l === l && x.w === w) + d;
  if (i < 0 || i >= ALL.length) return;
  state = { game: ALL[i].g.id, level: ALL[i].l.n, wave: ALL[i].w, variant: state.variant };
  render(true, { scroll: true });
}
function rotate(d) { rot = (rot + d + 4) % 4; save(); render(true, { scroll: true }); }
function toggleFit() { fit = !fit; save(); render(); }

function fromHash() {
  const m = /^#(strategy|gridlock)-(\d+)-(\d+)(?:-([a-z]+))?(?:-r([0-3]))?$/.exec(location.hash);
  if (!m) return;
  state = { game: m[1], level: +m[2], wave: +m[3], variant: m[4] || null };
  if (m[5] !== undefined) rot = +m[5];
}

// buttons (desktop row and phone thumb bar)
document.getElementById('prev').onclick = () => step(-1);
document.getElementById('next').onclick = () => step(1);
document.getElementById('rotL').onclick = () => rotate(-1);
document.getElementById('rotR').onclick = () => rotate(1);
document.getElementById('fit').onclick = toggleFit;
document.getElementById('fitM').onclick = toggleFit;
document.getElementById('mPrev').onclick = () => step(-1);
document.getElementById('mNext').onclick = () => step(1);
document.getElementById('mRotL').onclick = () => rotate(-1);
document.getElementById('mRotR').onclick = () => rotate(1);
document.getElementById('mWhere').onclick = () => window.scrollTo({ top: 0, behavior: 'smooth' });
document.getElementById('fitHintBtn').onclick = () => rotate(1);
document.getElementById('optHits').onchange = e => { showHits = e.target.checked; save(); render(); };
document.getElementById('optSpawn').onchange = e => { showSpawn = e.target.checked; save(); render(); };

// swipe left / right on the board = next / previous wave (only when the board isn't wider than
// the screen, so a sideways swipe on a wide board still scrolls it)
(() => {
  const sc = document.getElementById('scroller');
  let sx = 0, sy = 0, st = 0, multi = false;
  sc.addEventListener('touchstart', e => {
    multi = e.touches.length > 1;
    if (multi) return;
    sx = e.touches[0].clientX; sy = e.touches[0].clientY; st = Date.now();
  }, { passive: true });
  sc.addEventListener('touchmove', e => { if (e.touches.length > 1) multi = true; }, { passive: true });
  sc.addEventListener('touchend', e => {
    if (multi || !e.changedTouches.length) return;
    const dx = e.changedTouches[0].clientX - sx, dy = e.changedTouches[0].clientY - sy;
    if (Date.now() - st > 800 || Math.abs(dx) < 50 || Math.abs(dx) < 1.5 * Math.abs(dy)) return;
    if (sc.scrollWidth > sc.clientWidth + 1) return;              // wide board: let it scroll
    step(dx < 0 ? 1 : -1);
  }, { passive: true });
})();

// keyboard (desktop)
document.addEventListener('keydown', e => {
  if (e.altKey || e.ctrlKey || e.metaKey) return;
  const k = e.key.toLowerCase();
  if (e.key === 'ArrowLeft') step(-1);
  else if (e.key === 'ArrowRight') step(1);
  else if (k === 'q' || e.key === '[') rotate(-1);
  else if (k === 'e' || e.key === ']') rotate(1);
  else if (k === 'v') { const { v, vs } = current(); state.variant = vs[(vs.findIndex(x => x[0] === v) + 1) % vs.length][0]; render(); }
  else if (k === 'f') toggleFit();
  else if (k === 'l') { showHits = !showHits; save(); render(); }
  else if (k === 'p' && !document.getElementById('optSpawn').disabled) { showSpawn = !showSpawn; save(); render(); }
});
window.addEventListener('hashchange', () => { fromHash(); render(false, { scroll: true }); });
let resizeTimer;
window.addEventListener('resize', () => { clearTimeout(resizeTimer); resizeTimer = setTimeout(() => render(false), 120); });

const opened = location.hash;
fromHash();
render(true, { scroll: !!opened });       // a link to a specific wave opens on its board (phones)
</script>
</body>
</html>
