<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Isogram finder</title>
<style>
:root{
  --bg:#E6ECF0; --ink:#1B2A38; --muted:#5A6B7A; --line:#C3CFD8;
  --tile:#E8C98C; --tile-edge:#B9955A; --tile-ink:#2A1E0E;
  --hit:#0F6B5F; --field:#FFFFFF;
  --serif:"Iowan Old Style","Palatino Linotype",Palatino,"Book Antiqua",Georgia,serif;
  --sans:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#15202A; --ink:#DCE5EC; --muted:#93A3B1; --line:#2E3E4C;
    --tile:#D9B876; --tile-edge:#8F7240; --tile-ink:#221809;
    --hit:#5FD1BE; --field:#1C2935;
  }
}
:root[data-theme="dark"]{
  --bg:#15202A; --ink:#DCE5EC; --muted:#93A3B1; --line:#2E3E4C;
  --tile:#D9B876; --tile-edge:#8F7240; --tile-ink:#221809;
  --hit:#5FD1BE; --field:#1C2935;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);line-height:1.5;
  padding:env(safe-area-inset-top,0px) env(safe-area-inset-right,0px) env(safe-area-inset-bottom,0px) env(safe-area-inset-left,0px)}
main{max-width:76rem;margin:0 auto;padding:2.5rem 1.25rem 4rem}
h1{margin:0;display:flex;gap:.35rem;flex-wrap:wrap}
.tile{display:inline-grid;place-items:center;width:3rem;height:3.25rem;border-radius:.3rem;
  background:var(--tile);color:var(--tile-ink);font-family:var(--serif);font-size:1.9rem;font-weight:700;
  box-shadow:inset 0 -.25rem 0 var(--tile-edge);line-height:1}
.tile:nth-child(odd){transform:rotate(-1.5deg)} .tile:nth-child(3n){transform:rotate(1.2deg)}
.lede{font-family:var(--serif);font-size:1.15rem;color:var(--muted);margin:1rem 0 2rem;max-width:36rem}
label.field{display:block;font-weight:600;margin-bottom:.4rem}
#letters{width:100%;font-family:var(--serif);font-size:2rem;letter-spacing:.3em;padding:.5rem .8rem;
  border:2px solid var(--line);border-radius:.4rem;background:var(--field);color:var(--ink);text-transform:lowercase}
#letters:focus{outline:3px solid var(--hit);outline-offset:2px;border-color:transparent}
.controls{display:flex;flex-wrap:wrap;gap:1rem 2rem;align-items:center;margin:1rem 0 .5rem}
fieldset{border:0;padding:0;margin:0;display:flex;flex-wrap:wrap;gap:.25rem 1.25rem}
legend{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.controls label{cursor:pointer;display:inline-flex;align-items:center;gap:.35rem}
input[type=radio],input[type=checkbox]{accent-color:var(--hit)}
select{font:inherit;padding:.25rem .4rem;border:1px solid var(--line);border-radius:.3rem;background:var(--field);color:var(--ink)}
:focus-visible{outline:3px solid var(--hit);outline-offset:2px}
#note{min-height:1.5em;color:var(--muted);margin:.25rem 0 1.5rem}
.cols{display:grid;grid-template-columns:repeat(3,1fr);gap:2.5rem}
@media (max-width:56rem){.cols{grid-template-columns:1fr}}
@media (max-width:40rem){.tile{width:2.4rem;height:2.6rem;font-size:1.5rem}}
h2{font-family:var(--serif);font-size:1.4rem;margin:0 0 .75rem;padding-bottom:.4rem;border-bottom:2px solid var(--ink);
  display:flex;justify-content:space-between;align-items:baseline}
h2 span{font-family:var(--sans);font-size:.95rem;font-weight:400;color:var(--muted)}
ul{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(7.5rem,1fr));gap:.1rem 1rem;
  font-family:var(--serif);font-size:1.1rem}
li{padding:.1rem 0}
li b{color:var(--hit)}
.empty{font-family:var(--serif);color:var(--muted);font-style:italic}
.more{margin-top:1rem;font:inherit;background:none;border:1px solid var(--line);color:var(--ink);padding:.35rem .8rem;border-radius:.3rem;cursor:pointer}
@media (prefers-reduced-motion:no-preference){ li{animation:none} }
</style>
</head>
<body>
<main>
  <h1 aria-label="Isogram"><span class="tile" aria-hidden="true">I</span><span class="tile" aria-hidden="true">S</span><span class="tile" aria-hidden="true">O</span><span class="tile" aria-hidden="true">G</span><span class="tile" aria-hidden="true">R</span><span class="tile" aria-hidden="true">A</span><span class="tile" aria-hidden="true">M</span></h1>
  <p class="lede">Six-, seven- and eight-letter words with no repeated letters. Type some letters and the lists narrow as you go.</p>

  <label class="field" for="letters">Letters</label>
  <input id="letters" type="text" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="e.g. ing" autofocus>

  <div class="controls">
    <fieldset>
      <legend>Match</legend>
      <label><input type="radio" name="mode" value="all" checked> Contains all these letters</label>
      <label><input type="radio" name="mode" value="only"> Uses only these letters</label>
      <label><input type="radio" name="mode" value="seq"> Contains them in this order</label>
    </fieldset>
    <label><input type="checkbox" id="dedupe" checked> Hide anagrams (keep the most common)</label>
    <label>Sort <select id="sort"><option value="freq">Most common first</option><option value="alpha">A to Z</option></select></label>
  </div>
  <p id="note" aria-live="polite"></p>

  <div class="cols">
    <section><h2>6 letters <span id="c6"></span></h2><ul id="l6"></ul><p class="empty" id="e6" hidden></p><button class="more" id="m6" hidden></button></section>
    <section><h2>7 letters <span id="c7"></span></h2><ul id="l7"></ul><p class="empty" id="e7" hidden></p><button class="more" id="m7" hidden></button></section>
    <section><h2>8 letters <span id="c8"></span></h2><ul id="l8"></ul><p class="empty" id="e8" hidden></p><button class="more" id="m8" hidden></button></section>
  </div>
</main>

const SIZES = [6,7,8];
const ALPHA = {}; for (const n of SIZES) ALPHA[n] = [...WORDS[n]].sort();
const KEEP = {};
for (const n of SIZES){ const seen = new Set();
  KEEP[n] = new Set(WORDS[n].filter(w => { const k=[...w].sort().join(""); if (seen.has(k)) return false; seen.add(k); return true; })); }
const PAGE = 400;
const shown = {6:PAGE, 7:PAGE, 8:PAGE};
const $ = id => document.getElementById(id);
const input = $("letters"), sortSel = $("sort"), dedupe = $("dedupe");

function mode(){ return document.querySelector('input[name=mode]:checked').value; }

function highlight(w, set, seq){
  if (seq){ const i = w.indexOf(seq); return w.slice(0,i)+"<b>"+seq+"</b>"+w.slice(i+seq.length); }
  if (!set.size) return w;
  let s=""; for (const ch of w) s += set.has(ch) ? "<b>"+ch+"</b>" : ch; return s;
}

function render(resetPaging){
  if (resetPaging){ for (const n of SIZES) shown[n]=PAGE; }
  const raw = input.value.toLowerCase().replace(/[^a-z]/g,"");
  if (raw !== input.value.toLowerCase()) input.value = raw;
  const m = mode();
  const set = new Set(raw);
  const dupes = [...set].filter(c => raw.split(c).length > 2);
  let note = "";
  let test;
  if (!raw){ test = () => true; }
  else if (m === "all"){ test = w => { for (const c of set) if (!w.includes(c)) return false; return true; };
    if (dupes.length) note = "Isograms can't repeat a letter, so each of " + dupes.join(", ") + " counts once."; }
  else if (m === "only"){ test = w => { for (const c of w) if (!set.has(c)) return false; return true; };
    if (set.size < 6) note = "Enter at least 6 different letters to find words made only from them."; }
  else { test = w => w.includes(raw);
    if (dupes.length) note = "No isogram contains a repeated letter. Remove the extra " + dupes.join(", ") + " to see matches."; }

  for (const n of SIZES){
    const base = sortSel.value === "alpha" ? ALPHA[n] : WORDS[n];
    const src = dedupe.checked ? base.filter(w => KEEP[n].has(w)) : base;
    const hits = src.filter(test);
    const list = hits.slice(0, shown[n]);
    $("l"+n).innerHTML = list.map(w => "<li>"+highlight(w, m==="only"?new Set():set, m==="seq"?raw:"")+"</li>").join("");
    $("c"+n).textContent = raw ? hits.length.toLocaleString()+" of "+src.length.toLocaleString() : src.length.toLocaleString()+" words";
    const e = $("e"+n); e.hidden = hits.length > 0; e.textContent = "No " + n + "-letter isograms match.";
    const more = $("m"+n); const left = hits.length - list.length;
    more.hidden = left <= 0; more.textContent = "Show " + Math.min(left, PAGE*5).toLocaleString() + " more";
  }
  $("note").textContent = note;
}

input.addEventListener("input", () => render(true));
sortSel.addEventListener("change", () => render(true));
dedupe.addEventListener("change", () => render(true));
document.querySelectorAll('input[name=mode]').forEach(r => r.addEventListener("change", () => render(true)));
for (const n of SIZES) $("m"+n).addEventListener("click", () => { shown[n] += PAGE*5; render(false); });
render(true);
</script>
